<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5eadb">
<title>Хрумс: Головоломки</title>

<style>
*{
 box-sizing:border-box;
}

:root{
 --bg:#f5eadb;
 --panel:#fffaf3;
 --panel2:#e9d9c6;
 --text:#49382f;
 --muted:#927d6d;
 --border:#ffffff;
 --shadow:#bda58d;
 --green:#52c786;
 --gold:#ffc56c;
 --overlay:#24180fc4;
}

body.dark{
 --bg:#171d2a;
 --panel:#293448;
 --panel2:#3b4960;
 --text:#f6f0e9;
 --muted:#b8c2d2;
 --border:#4b5b73;
 --shadow:#0b111b;
 --green:#50ca91;
 --gold:#ffc979;
 --overlay:#080c16e3;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:var(--bg);
 color:var(--text);
 font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
 user-select:none;
 -webkit-user-select:none;
 touch-action:manipulation;
 overscroll-behavior:none;
}

button{
 font:inherit;
 color:inherit;
 border:0;
 cursor:pointer;
 -webkit-tap-highlight-color:transparent;
}

button:disabled{
 opacity:.4;
 cursor:default;
}

button:focus-visible{
 outline:3px solid var(--gold);
 outline-offset:3px;
}

#app{
 position:fixed;
 inset:0;
 display:flex;
 flex-direction:column;
 padding-top:env(safe-area-inset-top);
 padding-bottom:env(safe-area-inset-bottom);
 overflow:hidden;
}

#header{
 flex:none;
 display:flex;
 align-items:center;
 gap:7px;
 padding:7px 9px;
 width:min(500px,100%);
 margin:0 auto;
}

.ui{
 min-height:43px;
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:14px;
 box-shadow:0 3px 0 var(--shadow);
 display:flex;
 align-items:center;
 justify-content:center;
 padding:8px 10px;
 font-size:14px;
 font-weight:850;
 white-space:nowrap;
}

.ui.icon{
 width:43px;
 flex:none;
 font-size:20px;
 padding:0;
}

#levelBtn{
 flex:1;
 min-width:0;
 overflow:hidden;
 text-overflow:ellipsis;
}

#coins{
 flex:none;
}

#gameArea{
 flex:1;
 min-height:0;
 position:relative;
 overflow:hidden;
}

#game{
 display:block;
 width:100%;
 height:100%;
 touch-action:none;
}

#bottom{
 flex:none;
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:7px;
 width:min(500px,100%);
 padding:6px 9px 9px;
 margin:0 auto;
}

.boost{
 min-width:0;
 min-height:64px;
 border-radius:15px;
 background:var(--panel);
 border:1px solid var(--border);
 box-shadow:0 3px 0 var(--shadow);
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:3px;
 font-size:11px;
 font-weight:850;
 text-align:center;
 padding:6px 2px;
}

.boost span:first-child{
 font-size:25px;
 line-height:1;
}

.ui:active,
.boost:active:not(:disabled){
 transform:translateY(2px);
 box-shadow:0 1px 0 var(--shadow);
}

#overlay{
 position:absolute;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 padding:
  calc(12px + env(safe-area-inset-top))
  14px
  calc(12px + env(safe-area-inset-bottom));
 background:var(--overlay);
 backdrop-filter:blur(7px);
 z-index:20;
}

#overlay.visible{
 display:flex;
}

.dialog{
 width:min(410px,100%);
 max-height:100%;
 overflow-y:auto;
 overscroll-behavior:contain;
 background:var(--panel);
 border:2px solid var(--border);
 border-radius:24px;
 padding:22px;
 text-align:center;
 box-shadow:0 20px 70px #0005;
}

.dialog h2{
 margin:0 0 10px;
 font-size:27px;
}

.dialog p{
 color:var(--muted);
 line-height:1.5;
 margin:8px 0 18px;
}

.hero{
 font-size:60px;
 margin-bottom:8px;
}

.action{
 width:100%;
 min-height:48px;
 border-radius:13px;
 background:var(--panel2);
 font-weight:850;
 margin-top:9px;
 padding:10px;
}

.action.primary{
 background:var(--green);
 color:white;
}

.action.gold{
 background:var(--gold);
 color:#583d23;
}

.setting{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 padding:12px 0;
 border-bottom:1px solid var(--panel2);
 font-weight:750;
}

.toggle{
 min-width:90px;
 padding:10px;
 border-radius:11px;
 background:var(--panel2);
 font-weight:850;
}

.toggle.on{
 background:var(--green);
 color:white;
}

#levelGrid{
 display:grid;
 grid-template-columns:repeat(5,minmax(0,1fr));
 gap:7px;
 margin:15px 0;
}

.levelCell{
 aspect-ratio:1;
 border-radius:10px;
 background:var(--panel2);
 font-weight:900;
}

.levelCell.done{
 background:#9cdeb0;
 color:#25613c;
}

.levelCell.current{
 background:var(--gold);
 color:#67401d;
 outline:2px solid #e99b32;
}

.pages{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

.pages button{
 width:73px;
 min-height:42px;
 border-radius:11px;
 background:var(--panel2);
 font-weight:900;
}

#toast{
 position:absolute;
 top:calc(66px + env(safe-area-inset-top));
 left:50%;
 transform:translate(-50%,-10px);
 width:max-content;
 max-width:90vw;
 background:var(--text);
 color:var(--panel);
 padding:11px 16px;
 border-radius:13px;
 text-align:center;
 font-size:13px;
 font-weight:800;
 line-height:1.4;
 opacity:0;
 pointer-events:none;
 transition:.2s;
 z-index:50;
}

#toast.show{
 opacity:1;
 transform:translate(-50%,0);
}

#adBanner{
 display:none;
 position:relative;
 flex:none;
 align-items:center;
 justify-content:center;
 max-width:100%;
 overflow:hidden;
 z-index:5;
}

#adBanner.active{
 display:flex;
}

@media(max-height:650px){
 #header{
  padding-top:4px;
  padding-bottom:4px;
 }

 .ui{
  min-height:38px;
 }

 #bottom{
  padding-top:3px;
  padding-bottom:5px;
 }

 .boost{
  min-height:48px;
  font-size:10px;
 }

 .boost span:first-child{
  font-size:20px;
 }

 .dialog{
  padding:15px;
 }

 .dialog h2{
  font-size:23px;
 }
}

@media(min-width:900px) and (orientation:landscape){
 #app{
  display:grid;
  grid-template-columns:minmax(180px,250px) minmax(0,1fr) minmax(160px,210px);
  grid-template-rows:minmax(0,1fr);
  align-items:center;
  gap:12px;
  padding:16px;
 }

 #header{
  grid-column:1;
  grid-row:1;
  align-self:start;
  width:100%;
  flex-wrap:wrap;
  padding:0;
 }

 #levelBtn{
  order:5;
  flex-basis:100%;
 }

 #gameArea{
  grid-column:2;
  grid-row:1;
  width:100%;
  height:100%;
  min-height:0;
 }

 #bottom{
  grid-column:3;
  grid-row:1;
  width:100%;
  grid-template-columns:1fr;
  align-self:center;
  padding:0;
 }

 .boost{
  min-height:75px;
  font-size:13px;
 }

 #adBanner{
  grid-column:1;
  grid-row:1;
  align-self:end;

}

</head>

<script>
"use strict";

/* =====================================
   КОНФИГУРАЦИЯ
===================================== */

const TOTAL=500;

const AD_CONFIG={
 enabled:false,
 banner:true,
 appOpen:true,
 interstitial:true,
 rewarded:true,
 everyLevels:4,
 cooldown:180000,
 ids:{
  banner:"",
  appOpen:"",
  interstitial:"",
  rewarded:""
 }
};

const $=id=>document.getElementById(id);

const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

const safeInt=(n,a,b,f)=>
 Number.isFinite(n)?clamp(Math.floor(n),a,b):f;

/* =====================================
   СОХРАНЕНИЯ
===================================== */

const SAVE_KEY="hrums_puzzle_complete_v1";

const DEFAULT={
 current:0,
 unlocked:0,
 coins:100,
 completed:[],
 theme:"light",
 music:true,
 sound:true,
 effects:true
};

let save={...DEFAULT,completed:[]};

try{
 const raw=localStorage.getItem(SAVE_KEY);

 if(raw){
  const d=JSON.parse(raw);

  if(d&&typeof d==="object"){
   save.current=safeInt(d.current,0,499,0);
   save.unlocked=safeInt(d.unlocked,0,499,0);
   save.coins=safeInt(d.coins,0,99999999,100);

   save.completed=Array.isArray(d.completed)
    ?[...new Set(d.completed.filter(n=>
      Number.isInteger(n)&&n>=0&&n<500))]
    :[];

   save.theme=d.theme==="dark"?"dark":"light";
   save.music=d.music!==false;
   save.sound=d.sound!==false;
   save.effects=d.effects!==false;
  }
 }
}catch(e){}

save.unlocked=Math.max(save.unlocked,save.current);

function persist(){
 try{
  localStorage.setItem(SAVE_KEY,JSON.stringify(save));
 }catch(e){}
}

function applyTheme(){
 document.body.classList.toggle("dark",save.theme==="dark");

 document.querySelector('meta[name="theme-color"]').content=
  save.theme==="dark"?"#171d2a":"#f5eadb";
}

applyTheme();

/* =====================================
   ЗВУК
===================================== */

const Sound={
 ctx:null,
 master:null,
 noise:null,
 timer:null,
 next:0,
 step:0,
 lastEat:0,

 init(){
  try{
   if(!this.ctx){
    const AC=window.AudioContext||window.webkitAudioContext;

    if(!AC)return;

    this.ctx=new AC();

    this.master=this.ctx.createGain();
    this.master.gain.value=.42;
    this.master.connect(this.ctx.destination);

    const size=Math.floor(this.ctx.sampleRate*.15);

    this.noise=this.ctx.createBuffer(1,size,this.ctx.sampleRate);

    const data=this.noise.getChannelData(0);

    for(let i=0;i<size;i++){
     data[i]=Math.random()*2-1;
    }
   }

   if(this.ctx.state==="suspended"){
    this.ctx.resume().catch(()=>{});
   }

   if(!this.timer){
    this.timer=setInterval(()=>this.musicTick(),150);
   }
  }catch(e){}
 },

 tone(freq,duration=.1,type="sine",volume=.08,delay=0,end=0){
  if(!this.ctx||this.ctx.state!=="running")return;

  const t=this.ctx.currentTime+delay;

  const osc=this.ctx.createOscillator();
  const gain=this.ctx.createGain();

  osc.type=type;
  osc.frequency.setValueAtTime(Math.max(1,freq),t);

  if(end){
   osc.frequency.exponentialRampToValueAtTime(
    Math.max(1,end),t+duration
   );
  }

  const attack=Math.min(.012,duration*.3);

  gain.gain.setValueAtTime(.0001,t);
  gain.gain.exponentialRampToValueAtTime(
   Math.max(.0001,volume),t+attack
  );
  gain.gain.exponentialRampToValueAtTime(
   .0001,t+duration
  );

  osc.connect(gain);
  gain.connect(this.master);

  osc.start(t);
  osc.stop(t+duration+.02);
 },

 eat(){
  if(!save.sound||!this.ctx||!this.noise)return;

  const t=this.ctx.currentTime;

  if(t-this.lastEat<.045)return;
  this.lastEat=t;

  const source=this.ctx.createBufferSource();
  const filter=this.ctx.createBiquadFilter();
  const gain=this.ctx.createGain();

  source.buffer=this.noise;

  filter.type="bandpass";
  filter.frequency.value=1200+Math.random()*700;
  filter.Q.value=.8;

  gain.gain.setValueAtTime(.0001,t);
  gain.gain.exponentialRampToValueAtTime(.075,t+.006);
  gain.gain.exponentialRampToValueAtTime(.0001,t+.055);

  source.connect(filter);
  filter.connect(gain);
  gain.connect(this.master);

  source.start(t,Math.random()*.06,.06);

  this.tone(
   360+Math.random()*80,
   .08,"sine",.055,0,190
  );
 },

 play(name){
  if(!save.sound)return;

  this.init();

  if(name==="tap"){
   this.tone(540,.07,"sine",.07,0,790);
  }

  if(name==="send"){
   this.tone(440,.12,"triangle",.1,0,720);
  }

  if(name==="error"){
   this.tone(210,.15,"triangle",.09,0,120);
  }

  if(name==="buy"){
   this.tone(700,.12,"sine",.1);
   this.tone(1000,.16,"sine",.09,.08);
  }

  if(name==="eat"){
   this.eat();
  }

  if(name==="win"){
   [523,659,784,1047,1319].forEach((n,i)=>{
    this.tone(n,.35,"triangle",.09,i*.1);
   });
  }
 },

 musicTick(){
  if(!save.music||!this.ctx)return;
  if(this.ctx.state!=="running")return;
  if(document.hidden||paused||overlayOpen||adPlaying)return;

  const now=this.ctx.currentTime;

  if(this.next<now)this.next=now+.04;

  const notes=[262,294,330,349,392,440,494,523];
  const melody=[0,2,4,7,4,2,5,4,2,0,2,4,5,4,2,-1];

  while(this.next<now+.16){
   const n=melody[this.step%melody.length];

   if(n>=0){
    this.tone(
     notes[n],.22,"sine",.021,
     this.next-now
    );
   }

   if(this.step%4===0){
    this.tone(
     131,.38,"triangle",.018,
     this.next-now
    );
   }

   this.step++;
   this.next+=.3;
  }
 }
};

/* =====================================
   РЕКЛАМА
===================================== */

let adPlaying=false;

const Ads={
 sdkPromise:null,
 ready:false,
 busy:false,
 lastShow:0,

 unavailable(){
  toast("Реклама временно недоступна. Работы над подключением ведутся.");
 },

 async load(){
  if(!AD_CONFIG.enabled)return false;

  if(this.ready)return true;
  if(this.sdkPromise)return this.sdkPromise;

  this.sdkPromise=new Promise(resolve=>{
   if(window.Ya?.Context?.AdvManager){
    this.ready=true;
    resolve(true);
    return;
   }

   window.yaContextCb=window.yaContextCb||[];

   const script=document.createElement("script");
   script.src="https://yandex.ru/ads/system/context.js";
   script.async=true;

   let settled=false;

   const finish=ok=>{
    if(settled)return;
    settled=true;
    clearTimeout(timer);
    this.ready=ok;
    resolve(ok);
   };

   const timer=setTimeout(()=>finish(false),12000);

   script.onload=()=>{
    window.yaContextCb.push(()=>{
     finish(!!window.Ya?.Context?.AdvManager);
    });
   };

   script.onerror=()=>finish(false);

   document.head.appendChild(script);
  });

  return this.sdkPromise;
 },

 async banner(){
  const container=$("adBanner");

  container.classList.remove("active");

  if(!AD_CONFIG.enabled||!AD_CONFIG.banner)return;
  if(!AD_CONFIG.ids.banner)return;

  if(!await this.load())return;

  $("yandex_rtb_banner").replaceChildren();

  try{
   window.Ya.Context.AdvManager.render({
    blockId:AD_CONFIG.ids.banner,
    renderTo:"yandex_rtb_banner",

    onRender:()=>{
     container.classList.add("active");
     resize();
    },

    onError:()=>{
     container.classList.remove("active");
     resize();
    }
   });
  }catch(e){
   container.classList.remove("active");
  }
 },

 async rewarded(){
  /*
   Вознаграждение не выдаётся без подтверждения
   от рекламного SDK.

   Поддержка rewarded-формата зависит от площадки
   и доступного способа интеграции РСЯ.
  */

  if(!AD_CONFIG.enabled||
     !AD_CONFIG.rewarded||
     !AD_CONFIG.ids.rewarded){
   this.unavailable();
   return false;
  }

  if(this.busy)return false;

  if(!await this.load()){
   this.unavailable();
   return false;
  }

  this.busy=true;
  adPlaying=true;

  let rewarded=false;

  try{
   await new Promise(resolve=>{
    let done=false;

    const finish=()=>{
     if(done)return;
     done=true;
     clearTimeout(timer);
     resolve();
    };

    const timer=setTimeout(finish,45000);

    window.Ya.Context.AdvManager.render({
     blockId:AD_CONFIG.ids.rewarded,
     type:"rewarded",
     platform:"touch",

     onRewarded:()=>{
      rewarded=true;
     },

     onClose:finish,
     onError:finish
    });
   });

   if(rewarded){
    save.coins=Math.min(99999999,save.coins+50);
    persist();
    updateUI();
    Sound.play("buy");
    toast("🎉 Получено 50 монет!");
    return true;
   }

   this.unavailable();
   return false;
  }catch(e){
   this.unavailable();
   return false;
  }finally{
   this.busy=false;
   adPlaying=false;
  }
 },

 async init(){
  if(!AD_CONFIG.enabled)return;

  if(!await this.load())return;

  this.banner();
 }
};

/* =====================================

===================================== */

function rng(seed){
 let a=seed|0;

 return()=>{
  a=(a+0x6D2B79F5)|0;

  let t=Math.imul(a^(a>>>15),1|a);
  t^=t+Math.imul(t^(t>>>7),61|t);

  return((t^(t>>>14))>>>0)/4294967296;
 };
}

function shapePoint(type,x,y,variant){
 const r=Math.hypot(x,y);
 const a=Math.atan2(y,x);

 switch(type){
  case 0:{
   const xx=x*1.2;
   const yy=-y*1.25+.15;

   return Math.pow(xx*xx+yy*yy-1,3)
    -xx*xx*yy*yy*yy<=0?1:0;
  }

  case 1:{
   const n=5+variant%4;

   const radius=.39+.58*Math.pow(
    (Math.cos(n*(a+Math.PI/2))+1)/2,1.3
   );

   return r<radius?1:0;
  }

  case 2:
   return r<.6+.35*Math.cos((5+variant%4)*a)?1:0;

  case 3:
   if(y<.1&&(x/.96)**2+((y-.1)/.7)**2<1)return 1;
   if(Math.abs(x)<.28&&y>.04&&y<.9)return 2;
   return 0;

  case 4:
   return ((x-.13)/.76)**2+(y/.49)**2<1||
    (x<-.48&&x>-.98&&Math.abs(y)<(-.45-x)*.9+.07)?1:0;

  case 5:
   return Math.hypot(x,y-.28)<.61||
    (y<.3&&y>-.95&&Math.abs(x)<(y+.95)*.5)?1:0;

  case 6:
   return r<.9&&Math.hypot(x-.4,y+.1)>.72?1:0;

  case 7:
   return r<.54||(r<.96&&r>.62&&Math.cos(10*a)>.3)?1:0;

  case 8:{
   const u=Math.abs(x);

   if(u<.08&&Math.abs(y)<.7)return 3;

   if(((u-.5)/.44)**2+((y+.3)/.55)**2<1)return 1;

   if(((u-.4)/.35)**2+((y-.4)/.4)**2<1)return 2;

   return 0;
  }

  case 9:
   if(y>-.12&&y<.85&&Math.abs(x)<.72)return 1;
   return y<-.12&&y>-.9&&Math.abs(x)<y+.9?2:0;

  case 10:
   if(Math.abs(x)<.13&&y>.72&&y<.95)return 3;

   for(let i=2;i>=0;i--){
    const y0=-.85+i*.46;

    if(y>=y0&&y<=y0+.72&&
       Math.abs(x)<(y-y0)/.72*(.4+i*.19)){
     return i%2?2:1;
    }
   }

   return 0;

  case 11:
   if(Math.abs(x)<.07&&y<-.4&&y>-.9)return 3;

   return Math.hypot(x+.28,y-.12)<.62||
    Math.hypot(x-.28,y-.12)<.62||
    Math.hypot(x,y-.3)<.62?1:0;

  case 12:
   return Math.abs(x)+Math.abs(y)*.85<.92?1:0;

  case 13:
   return r<.9?1:0;
 }

 return 0;
}

function generateLevel(index){
 if(index<PRESETS.length){
  return{
   name:PRESETS[index][0],
   rows:PRESETS[index][1]
  };
 }

 const random=rng(index*7919+12345);

 const type=(index*7+Math.floor(index/14))%SHAPES.length;

 const size=Math.min(16,12+Math.floor(index/125));
 const variant=index%16;

 const colorCount=Math.min(5,2+Math.floor(index/100));
 const start=Math.floor(random()*KEYS.length);

 const palette=[];

 for(let i=0;i<colorCount;i++){
  palette.push(KEYS[(start+i*3)%KEYS.length]);
 }

 const rows=[];
 const rotation=(index%7-3)*.035;

 const cs=Math.cos(rotation);
 const sn=Math.sin(rotation);

 for(let y=0;y<size;y++){
  let row="";

  for(let x=0;x<size;x++){
   const u=(x+.5)/size*2-1;
   const v=(y+.5)/size*2-1;

   const xx=u*cs-v*sn;
   const yy=u*sn+v*cs;

   const layer=shapePoint(type,xx,yy,variant);

   if(!layer){
    row+=".";
    continue;
   }

   let ci=0;

   if(layer>1){
    ci=Math.min(layer-1,palette.length-1);
   }else{
    ci=clamp(Math.floor(
     (Math.abs(xx)*.55+Math.abs(yy)*.75+random()*.25)
     *palette.length
    ),0,palette.length-1);
   }

   row+=palette[ci];
  }

  rows.push(row);
 }

 return{
  name:SHAPES[type],
  rows
 };
}

/* =====================================
   ИГРОВАЯ МОДЕЛЬ
===================================== */

const COLUMN_X=[92,200,308];

const SLOT_Y=420;
const COLUMN_Y=530;

let level=0;
let levelName="";

let cubes=[];
let columns=[[],[],[]];
let slots=[];
let ants=[];
let particles=[];

let total=0;
let cellSize=25;

let gameTime=0;
let turbo=0;
let extraSlot=false;

let paused=false;
let overlayOpen=false;
let finished=false;

let selectedColumn=1;

function slotX(i){
 return 200+(i-(slots.length-1)/2)*
  (slots.length>5?61:72);
}

function splitCount(count,random){
 const out=[];

 while(count>0){
  let n=Math.min(count,5+Math.floor(random()*7));

  if(count-n>0&&count-n<4)n=count;

  out.push(n);
  count-=n;
 }

 return out;
}

function createNest(color,count,column){
 return{
  color,
  left:count,
  active:0,
  column,
  x:COLUMN_X[column],
  y:COLUMN_Y,
  tx:COLUMN_X[column],
  ty:COLUMN_Y,
  timer:0,
  wait:0
 };
}

function startLevel(index){
 level=safeInt(index,0,499,0);

 const data=generateLevel(level);
 levelName=data.name;

 cubes=[];
 columns=[[],[],[]];
 slots=Array(5).fill(null);
 ants=[];
 particles=[];

 total=0;
 gameTime=0;
 turbo=0;
 extraSlot=false;
 finished=false;

 const rows=data.rows;

 const width=rows[0].length;
 const height=rows.length;

 cellSize=Math.min(25,286/Math.max(width,height));

 const counts={};

 for(let y=0;y<height;y++){
  for(let x=0;x<width;x++){
   const color=rows[y][x];

   if(color===".")continue;

   cubes.push({
    x:200-width*cellSize/2+(x+.5)*cellSize,
    y:204-height*cellSize/2+(y+.5)*cellSize,
    color,
    alive:true,
    claimed:false
   });

   counts[color]=(counts[color]||0)+1;
  }
 }

 total=cubes.length;

 const random=rng(level*1999+71);
 const all=[];

 for(const [color,count] of Object.entries(counts)){
  for(const amount of splitCount(count,random)){
   all.push({color,count:amount});
  }
 }

 for(let i=all.length-1;i>0;i--){
  const j=Math.floor(random()*(i+1));
  [all[i],all[j]]=[all[j],all[i]];
 }

 all.forEach((n,i)=>{
  const column=i%3;

  columns[column].push(
   createNest(n.color,n.count,column)
  );
 });

 closeOverlay();
 updateUI();
}

/* =====================================
   ИГРОВАЯ ЛОГИКА
===================================== */

function blocked(){
 return paused||overlayOpen||adPlaying||finished;
}

function hasAlive(color){
 return cubes.some(c=>c.alive&&c.color===color);
}

function hasFree(color){
 return cubes.some(c=>
  c.alive&&!c.claimed&&c.color===color
 );
}

function sendNest(column){
 if(blocked())return;

 const queue=columns[column];

 if(!queue.length)return;

 const free=slots.indexOf(null);

 if(free<0){
  Sound.play("error");
  toast("Нет свободных мест");
  return;
 }

 const n=queue.shift();

 slots[free]=n;
 n.tx=slotX(free);
 n.ty=SLOT_Y;

 selectedColumn=column;

 Sound.play("send");
}

function findTarget(n){
 let best=null;
 let distance=Infinity;

 for(const c of cubes){
  if(!c.alive||c.claimed||c.color!==n.color)continue;

  const d=Math.hypot(c.x-n.x,c.y-n.y);

  if(d<distance){
   distance=d;
   best=c;
  }
 }

 return best;
}

function burst(x,y,color,count=5){
 if(!save.effects)return;

 for(let i=0;i<count&&particles.length<140;i++){
  particles.push({
   x,y,
   vx:(Math.random()-.5)*150,
   vy:-Math.random()*130,
   life:.3+Math.random()*.3,
   size:2+Math.random()*3,
   color:COLORS[color]
  });
 }
}

function update(dt){
 gameTime+=dt;

 turbo=Math.max(0,turbo-dt);

 const speed=turbo>0?1.8:1;

 for(let i=0;i<3;i++){
  columns[i]=columns[i].filter(n=>hasAlive(n.color));
 }

 slots.forEach((n,i)=>{
  if(!n)return;

  n.tx=slotX(i);
  n.ty=SLOT_Y;

  const k=Math.min(1,dt*12);

  n.x+=(n.tx-n.x)*k;
  n.y+=(n.ty-n.y)*k;
 });

 slots.forEach((n,i)=>{
  if(!n)return;

  if(Math.hypot(n.x-n.tx,n.y-n.ty)<5){
   n.timer+=dt;

   let attempts=0;

   while(n.timer>=.12/speed&&n.left>0&&attempts<5){
    attempts++;

    const cube=findTarget(n);

    if(!cube)break;

    n.timer-=.12/speed;
    n.left--;
    n.active++;
    cube.claimed=true;

    ants.push({
     x:n.x,
     y:n.y-17,
     angle:-Math.PI/2,
     cube,
     nest:n,
     returning:false,
     phase:Math.random()*10
    });
   }
  }

  if(n.left>0&&!hasAlive(n.color)){
   n.left=0;
  }

  /*
   Если гнезду нечего есть, а жуки уже вернулись,
   оно освобождает слот.

   Неиспользованных жуков возвращаем в очередь,
   чтобы не возникало тупиков.
  */

  if(n.left>0&&n.active===0&&!hasFree(n.color)){
   n.wait+=dt;

   if(n.wait>1.2){
    n.wait=0;
    slots[i]=null;

    if(hasAlive(n.color)){
     n.x=COLUMN_X[n.column];
     n.y=COLUMN_Y;

     columns[n.column].push(n);
    }

    return;
   }
  }else{
   n.wait=0;
  }

  if(n.left===0&&n.active===0){
   slots[i]=null;
  }
 });

 for(let i=ants.length-1;i>=0;i--){
  const a=ants[i];

  const tx=a.returning?a.nest.x:a.cube.x;
  const ty=a.returning?a.nest.y-15:a.cube.y;

  const dx=tx-a.x;
  const dy=ty-a.y;

  const distance=Math.hypot(dx,dy);
  const step=280*speed*dt;

  if(distance>0){
   a.angle=Math.atan2(dy,dx);
  }

  if(distance<=step+2){
   if(!a.returning){
    a.cube.alive=false;
    a.returning=true;

    burst(a.cube.x,a.cube.y,a.cube.color);

    Sound.play("eat");
   }else{
    a.nest.active--;
    ants.splice(i,1);
   }
  }else{
   a.x+=dx/distance*step;
   a.y+=dy/distance*step;
  }
 }

 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];

  p.life-=dt;
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.vy+=300*dt;

  if(p.life<=0){
   particles.splice(i,1);
  }
 }

 if(!finished&&
    !cubes.some(c=>c.alive)&&
    ants.length===0){
  completeLevel();
 }
}

function completeLevel(){
 finished=true;
 paused=true;

 const first=!save.completed.includes(level);

 if(first){
  save.completed.push(level);
  save.coins=Math.min(99999999,save.coins+40);
 }

 save.unlocked=Math.max(
  save.unlocked,
  Math.min(499,level+1)
 );

 save.current=Math.min(499,level+1);

 persist();
 updateUI();

 Sound.play("win");

 showDialog(`

  <h2>${last?"Все 500 уровней!":"Вкуснотища!"}</h2>

  <p>
   Уровень ${level+1} пройден!<br>
   ${first?"🪙 +40 монет":"Повторное прохождение"}
  </p>

  <button class="action primary" id="nextAction">
   ${last?"Выбор уровней":"Следующий уровень"}
  </button>

  <button class="action gold" id="rewardAction">

  </button>

  <button class="action" id="replayAction">
   Повторить
  </button>
 `,"result");

 $("nextAction").onclick=()=>{

 };

 $("rewardAction").onclick=()=>Ads.rewarded();

 $("replayAction").onclick=()=>startLevel(level);
}

function buy(type){
 if(blocked())return;

 const prices={
  turbo:30,
  bomb:50,
  slot:40
 };

 const price=prices[type];

 if(save.coins<price){
  toast("Недостаточно монет");
  Sound.play("error");
  return;
 }

 if(type==="slot"&&extraSlot)return;

 if(type==="bomb"&&!cubes.some(c=>c.alive&&!c.claimed)){
  toast("Нет доступных кубиков");
  return;
 }

 save.coins-=price;

 if(type==="turbo"){
  turbo+=12;
  toast("⚡ Турбо на 12 секунд");
 }

 if(type==="slot"){
  slots.push(null);
  extraSlot=true;
  toast("➕ Дополнительное место");
 }

 if(type==="bomb"){
  const available=cubes.filter(c=>c.alive&&!c.claimed);
  const random=rng(Date.now()|0);

  for(let i=available.length-1;i>0;i--){
   const j=Math.floor(random()*(i+1));
   [available[i],available[j]]=[available[j],available[i]];
  }

  available.slice(0,14).forEach(c=>{
   c.alive=false;
   burst(c.x,c.y,c.color,7);
  });

  toast("💥 Бум!");
 }

 persist();
 updateUI();

 Sound.play("buy");
}

   ГРАФИКА
===================================== */

function round(x,y,w,h,r,fill){
 g.fillStyle=fill;
 g.beginPath();
 g.roundRect(x,y,w,h,r);
 g.fill();
}

function text(value,x,y,size=16,color="#49372d"){
 g.fillStyle=color;
 g.font=`850 ${size}px system-ui`;
 g.textAlign="center";
 g.textBaseline="middle";
 g.fillText(String(value),x,y);
}

function shade(hex,delta){
 const v=parseInt(hex.slice(1),16);

 const c=n=>clamp(n+delta,0,255);

 return `rgb(${c(v>>16)},${c((v>>8)&255)},${c(v&255)})`;
}

function drawBackground(){
 const dark=save.theme==="dark";

 const grad=g.createLinearGradient(0,0,0,H);

 if(dark){
  grad.addColorStop(0,"#293247");
  grad.addColorStop(1,"#171c29");
 }else{
  grad.addColorStop(0,"#f8ebd8");
  grad.addColorStop(1,"#d9b18b");
 }

 g.fillStyle=grad;
 g.fillRect(0,0,W,H);

 for(let i=0;i<18;i++){
  const x=(i*113+30)%W;
  const y=(i*137+gameTime*2)%780-40;

  g.globalAlpha=dark?.045:.11;
  g.fillStyle="#fff";

  g.beginPath();
  g.arc(x,y,10+i%4*5,0,Math.PI*2);
  g.fill();
 }

 g.globalAlpha=1;
}

function drawCube(c){
 if(!c.alive)return;

 const s=cellSize-2;
 const x=c.x-s/2;
 const y=c.y-s/2;

 const base=COLORS[c.color];

 round(x+1,y+3,s,s,5,"#00000035");

 const grad=g.createLinearGradient(0,y,0,y+s);

 grad.addColorStop(0,shade(base,35));
 grad.addColorStop(.6,base);
 grad.addColorStop(1,shade(base,-20));

 round(x,y,s,s-3,5,grad);

 round(
  x+3,y+2,
  s-6,Math.max(3,s*.2),
  3,"#ffffff65"
 );

 g.strokeStyle="#ffffff55";
 g.lineWidth=1;

 g.beginPath();
 g.roundRect(x+.5,y+.5,s-1,s-4,5);
 g.stroke();
}

function drawNest(n,x,y,dim=false){
 g.save();

 g.translate(x,y);
 g.globalAlpha=dim?.5:1;

 const base=COLORS[n.color];

 round(-27,-24,54,51,16,"#00000040");

 const grad=g.createLinearGradient(0,-27,0,24);

 grad.addColorStop(0,shade(base,35));
 grad.addColorStop(1,shade(base,-25));

 round(-27,-28,54,51,16,grad);

 round(-21,-24,42,9,5,"#ffffff55");

 g.strokeStyle="#49332f";
 g.lineWidth=2;

 for(const side of [-1,1]){
  g.beginPath();
  g.moveTo(side*9,-26);
  g.quadraticCurveTo(side*16,-39,side*19,-35);
  g.stroke();

  g.fillStyle="white";
  g.beginPath();
  g.arc(side*10,-12,5.5,0,Math.PI*2);
  g.fill();

  g.fillStyle="#30252a";
  g.beginPath();
  g.arc(side*10,-12,2.8,0,Math.PI*2);
  g.fill();
 }

 round(-16,2,32,19,8,"#3b292b99");

 text(n.left,0,12,16,"white");

 g.restore();
}

function drawAnt(a){
 g.save();

 g.translate(a.x,a.y);
 g.rotate(a.angle);

 const base=COLORS[a.nest.color];

 g.strokeStyle="#38262d";
 g.lineWidth=1.3;

 for(let i=-1;i<=1;i++){
  const wave=Math.sin(gameTime*35+a.phase+i)*2;

  g.beginPath();

  g.moveTo(i*4,0);
  g.lineTo(i*4+wave,-7);

  g.moveTo(i*4,0);
  g.lineTo(i*4-wave,7);

  g.stroke();
 }

 for(const [x,r] of [[-6,4.5],[0,3.5],[6,4.5]]){
  g.fillStyle=base;

  g.beginPath();
  g.arc(x,0,r,0,Math.PI*2);
  g.fill();
  g.stroke();
 }

 g.fillStyle="white";
 g.fillRect(7,-3,2,2);
 g.fillRect(7,1,2,2);

 if(a.returning){
  g.fillStyle=COLORS[a.cube.color];
  g.fillRect(-5,-5,10,10);
 }

 g.restore();
}

function drawBoard(){
 const dark=save.theme==="dark";

 /*
   Прогресс находится над картинкой.
   Кубики начинаются ниже и не пересекаются
   с полоской и процентами.
 */

 round(
  18,12,364,40,16,
  dark?"#303b50":"#fffaf2"
 );

 const alive=cubes.reduce((n,c)=>n+(c.alive?1:0),0);
 const progress=total?1-alive/total:0;

 round(
  35,27,290,10,5,
  dark?"#1d2534":"#e8d8c8"
 );

 if(progress>0){
  round(
   35,27,Math.max(5,290*progress),
   10,5,"#65d08b"
  );
 }

 text(
  Math.round(progress*100)+"%",
  353,32,13,
  dark?"#e4e9f5":"#806b5d"
 );

 round(
  16,65,368,305,24,
  dark?"#111722":"#ad866b"
 );

 round(
  19,62,362,305,23,
  dark?"#354057":"#fff8ee"
 );

 /*
   Отдельная область картинки.
   Никаких элементов прогресса внутри неё нет.
 */

 cubes.forEach(drawCube);
}

function drawSlots(){
 const dark=save.theme==="dark";

 slots.forEach((n,i)=>{
  const x=slotX(i);

  round(
   x-30,SLOT_Y-30,60,61,16,
   dark?"#151c2a":"#987259"
  );

  round(
   x-27,SLOT_Y-28,54,56,14,
   dark?"#4b5972":"#ead1b7"
  );

  if(n){
   drawNest(n,n.x,n.y);
  }else{
   text(
    "+",x,SLOT_Y,25,
    dark?"#bac6db":"#a98e78"
   );
  }
 });
}

function drawColumns(){
 const dark=save.theme==="dark";

 for(let i=0;i<3;i++){
  const x=COLUMN_X[i];

  round(
   x-39,493,78,149,18,
   dark?"#121824":"#9c7358"
  );

  round(
   x-36,490,72,149,17,
   dark?"#39465d":"#d3aa84"
  );

  if(selectedColumn===i){
   g.strokeStyle=dark?"#8bd8ff":"#fff2a1";
   g.lineWidth=3;

   g.beginPath();
   g.roundRect(x-38,491,76,148,18);
   g.stroke();
  }

  const queue=columns[i];

  if(queue.length){
   drawNest(queue[0],x,COLUMN_Y);

   for(let j=1;j<=Math.min(3,queue.length-1);j++){
    round(
     x-25+(j-1)*18,
     583,
     14,14,4,
     COLORS[queue[j].color]
    );
   }
  }else{
   text("✓",x,COLUMN_Y,28,dark?"#8bd4aa":"#fff");
  }

  text(
   i+1,x,619,13,
   dark?"#c7d2e7":"#71503c"
  );
 }
}

function drawParticles(){
 for(const p of particles){
  g.globalAlpha=Math.min(1,p.life*2);
  g.fillStyle=p.color;

  g.beginPath();
  g.arc(p.x,p.y,p.size,0,Math.PI*2);
  g.fill();
 }

 g.globalAlpha=1;
}

function render(){
 g.setTransform(1,0,0,1,0,0);

 g.fillStyle=save.theme==="dark"?"#171d2a":"#f5eadb";

 g.fillRect(0,0,canvas.width,canvas.height);

 g.setTransform(scale,0,0,scale,ox,oy);

 drawBackground();
 drawBoard();
 drawSlots();
 drawColumns();

 ants.forEach(drawAnt);
 drawParticles();

 if(turbo>0){
  text(
   "⚡ "+Math.ceil(turbo)+"с",
   200,463,14,
   save.theme==="dark"?"#ffd57e":"#b77428"
  );
 }

 if(level===0&&gameTime<8&&!paused){
  round(
   78,648,244,25,12,
   save.theme==="dark"?"#30394b":"#fffaf0"
  );

  text(
   "Нажми на переднее гнездо",
   200,660,13,
   save.theme==="dark"?"#fff":"#49372d"
  );
 }
}

/* =====================================
   ИНТЕРФЕЙС
===================================== */

const overlay=$("overlay");
const dialog=$("dialog");

let screen="game";
let previousScreen="pause";

function showDialog(html,name="pause"){
 screen=name;
 overlayOpen=true;
 paused=true;

 dialog.innerHTML=html;
 overlay.classList.add("visible");

 requestAnimationFrame(()=>{
  dialog.querySelector("button")?.focus();
 });
}

function closeOverlay(){
 screen="game";
 overlayOpen=false;
 paused=false;

 overlay.classList.remove("visible");
 dialog.replaceChildren();
}

function toast(message){
 const el=$("toast");

 el.textContent=message;
 el.classList.add("show");

 clearTimeout(toast.timer);

 toast.timer=setTimeout(()=>{
  el.classList.remove("show");
 },2600);
}

function updateUI(){
 $("levelBtn").textContent=`Ур. ${level+1} · ${levelName}`;
 $("coins").textContent="🪙 "+save.coins;

 $("soundBtn").textContent=
  save.sound||save.music?"♫":"🔇";

 $("turboBtn").disabled=save.coins<30;
 $("bombBtn").disabled=save.coins<50;
 $("slotBtn").disabled=save.coins<40||extraSlot;
}

function openPause(){
 if(finished)return;

 showDialog(`
  <h2>Пауза</h2>
  <p>Уровень ${level+1} · ${levelName}</p>

  <button class="action primary" id="resumeAction">
   ▶ Продолжить
  </button>

  <button class="action" id="restartAction">
   🔄 Начать заново
  </button>

  <button class="action" id="levelsAction">
   🗺️ Выбор уровней
  </button>

  <button class="action" id="settingsAction">
   ⚙️ Настройки
  </button>

  <button class="action gold" id="pauseReward">
   🎬 Получить 50 монет
  </button>
 `,"pause");

 $("resumeAction").onclick=closeOverlay;
 $("restartAction").onclick=()=>startLevel(level);
 $("levelsAction").onclick=openLevels;
 $("settingsAction").onclick=()=>openSettings("pause");
 $("pauseReward").onclick=()=>Ads.rewarded();
}

function openSettings(from="pause"){
 previousScreen=from;

 showDialog(`
  <h2>Настройки</h2>

  <div class="setting">
   <span>🎨 Тема</span>
   <button class="toggle" data-setting="theme">
    ${save.theme==="dark"?"🌙 Тёмная":"☀️ Светлая"}
   </button>
  </div>

  <div class="setting">
   <span>🎵 Музыка</span>
   <button class="toggle ${save.music?"on":""}" data-setting="music">
    ${save.music?"ВКЛ":"ВЫКЛ"}
   </button>
  </div>

  <div class="setting">
   <span>🔊 Звуки</span>
   <button class="toggle ${save.sound?"on":""}" data-setting="sound">
    ${save.sound?"ВКЛ":"ВЫКЛ"}
   </button>
  </div>

  <div class="setting">
   <span>✨ Эффекты</span>
   <button class="toggle ${save.effects?"on":""}" data-setting="effects">
    ${save.effects?"ВКЛ":"ВЫКЛ"}
   </button>
  </div>

  <p>Настройки сохраняются автоматически.</p>

  <button class="action primary" id="settingsBack">
   Готово
  </button>
 `,"settings");

 dialog.querySelectorAll("[data-setting]").forEach(btn=>{
  btn.onclick=()=>{
   const key=btn.dataset.setting;

   if(key==="theme"){
    save.theme=save.theme==="dark"?"light":"dark";
    applyTheme();
   }else{
    save[key]=!save[key];
   }

   persist();
   updateUI();
   openSettings(from);
  };
 });

 $("settingsBack").onclick=()=>{
  if(from==="levels")openLevels();
  else if(from==="game")closeOverlay();
  else openPause();
 };
}

/* =====================================
   УРОВНИ
===================================== */

let levelPage=0;

function openLevels(){
 levelPage=Math.floor(level/25);
 renderLevels();
}

function renderLevels(){
 const start=levelPage*25;

 let cells="";

 for(let i=start;i<Math.min(TOTAL,start+25);i++){
  const done=save.completed.includes(i);
  const locked=i>save.unlocked;

  cells+=`
   <button
    class="levelCell ${done?"done":""} ${i===level?"current":""}"
    data-level="${i}"
    ${locked?"disabled":""}>
    ${locked?"🔒":i+1}
   </button>
  `;
 }

 showDialog(`
  <h2>Уровни</h2>
  <p>Пройдено: ${save.completed.length} / 500</p>

  <div id="levelGrid">${cells}</div>

  <div class="pages">
   <button id="prevPage" ${levelPage===0?"disabled":""}>◀</button>
   <strong>${levelPage+1} / 20</strong>
   <button id="nextPage" ${levelPage===19?"disabled":""}>▶</button>
  </div>

  <button class="action primary" id="levelsBack">
   Вернуться
  </button>
 `,"levels");

 dialog.querySelectorAll("[data-level]").forEach(btn=>{
  btn.onclick=()=>{
   Sound.play("tap");
   startLevel(Number(btn.dataset.level));
  };
 });

 $("prevPage").onclick=()=>{
  levelPage=Math.max(0,levelPage-1);
  renderLevels();
 };

 $("nextPage").onclick=()=>{
  levelPage=Math.min(19,levelPage+1);
  renderLevels();
 };

 $("levelsBack").onclick=closeOverlay;
}

/* =====================================
   УПРАВЛЕНИЕ
===================================== */

function pointerPosition(e){
 const rect=canvas.getBoundingClientRect();

 const factor=canvas.width/rect.width;

 return{
  x:((e.clientX-rect.left)*factor-ox)/scale,
  y:((e.clientY-rect.top)*factor-oy)/scale
 };
}

canvas.addEventListener("pointerdown",e=>{
 if(blocked())return;

 Sound.init();

 const p=pointerPosition(e);

 if(p.y>=490&&p.y<=642){
  for(let i=0;i<3;i++){
   if(Math.abs(p.x-COLUMN_X[i])<40){
    sendNest(i);
    return;
   }
  }
 }
});

$("pauseBtn").onclick=()=>{
 Sound.init();
 openPause();
};

$("levelBtn").onclick=()=>{
 Sound.init();
 openLevels();
};

$("soundBtn").onclick=()=>{
 Sound.init();

 const enabled=save.sound||save.music;

 save.sound=!enabled;
 save.music=!enabled;

 persist();
 updateUI();
};

$("turboBtn").onclick=()=>{
 Sound.init();
 buy("turbo");
};

$("bombBtn").onclick=()=>{
 Sound.init();
 buy("bomb");
};

$("slotBtn").onclick=()=>{
 Sound.init();
 buy("slot");
};

$("rewardBtn").onclick=()=>{
 Sound.init();
 Ads.rewarded();
};

/* =====================================
   КЛАВИАТУРА И ТВ
===================================== */

function goBack(){
 if(!overlayOpen){
  openPause();
  return;
 }

 if(screen==="settings"){
  if(previousScreen==="levels")openLevels();
  else if(previousScreen==="game")closeOverlay();
  else openPause();
 }else if(screen==="result"){
  startLevel(level);
 }else{
  closeOverlay();
 }
}

document.addEventListener("keydown",e=>{
 if(overlayOpen){
  if(e.key==="Escape"||e.key==="Backspace"){
   e.preventDefault();
   goBack();
   return;
  }

  const buttons=[...dialog.querySelectorAll("button:not(:disabled)")];

  if(!buttons.length)return;

  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)){
   e.preventDefault();

   let i=buttons.indexOf(document.activeElement);

   if(i<0)i=0;

   const current=document.activeElement;

   if(current.classList.contains("levelCell")){
    const delta=
     e.key==="ArrowDown"?5:
     e.key==="ArrowUp"?-5:
     e.key==="ArrowRight"?1:-1;

    i=clamp(i+delta,0,buttons.length-1);
   }else{
    const delta=
     e.key==="ArrowDown"||e.key==="ArrowRight"?1:-1;

    i=(i+delta+buttons.length)%buttons.length;
   }

   buttons[i].focus();
  }

  return;
 }

 if(e.key==="Escape"||e.key==="Backspace"){
  e.preventDefault();
  openPause();
  return;
 }

 if(e.key==="ArrowLeft"){
  e.preventDefault();
  selectedColumn=Math.max(0,selectedColumn-1);
 }

 if(e.key==="ArrowRight"){
  e.preventDefault();
  selectedColumn=Math.min(2,selectedColumn+1);
 }

 if(e.key==="Enter"||e.key===" "){
  e.preventDefault();
  Sound.init();
  sendNest(selectedColumn);
 }

 if(["1","2","3"].includes(e.key)){
  Sound.init();
  sendNest(Number(e.key)-1);
 }
});

/* =====================================
   СВОРАЧИВАНИЕ
===================================== */

document.addEventListener("visibilitychange",()=>{
 if(document.hidden&&!paused&&!overlayOpen&&!adPlaying){
  openPause();
 }
});

/* =====================================
   ГЛАВНЫЙ ЦИКЛ
===================================== */

let previous=performance.now();

function frame(now){
 const dt=Math.min(.04,Math.max(0,(now-previous)/1000));

 previous=now;

 try{
  if(!blocked()){
   update(dt);
  }

  render();
 }catch(error){
  console.error("Хрумс:",error);
 }

 requestAnimationFrame(frame);
}

/* =====================================
   ЗАПУСК
===================================== */

startLevel(save.current);
requestAnimationFrame(frame);

Ads.init();

</script>
